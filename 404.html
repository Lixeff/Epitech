<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>EPITECH MOE</title>
  <script>
    // Redirect SPA routes to index.html on GitHub Pages
    // Stores the current path in sessionStorage so the app can restore it
    var path = window.location.pathname;
    sessionStorage.setItem('redirect', path);
    window.location.replace('/');
  </script>
</head>
<body></body>
</html>
